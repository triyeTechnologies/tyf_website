<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found — Try your Fit</title>
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0A0C'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23CA5995'/%3E%3C/svg%3E">
<!--
  Vercel serves this for any path that matches no file. It is deliberately
  self-contained — no webfont, no script, nothing to fetch — because the one
  page that must never fail is the one that says something already did.
  System fonts here, rather than the site's Bricolage/Inter, for that reason.
-->
<style>
  :root{
    --black:#0A0A0C; --white:#fff; --neon:#CA5995;
    --neon-glow:rgba(202,89,149,.34); --muted:rgba(255,255,255,.6);
    --line:rgba(255,255,255,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--black);color:var(--white);min-height:100vh;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    display:grid;place-items:center;padding:30px;text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 40% at 8% 0%,rgba(202,89,149,.11),transparent 70%),
      radial-gradient(50% 40% at 96% 100%,rgba(202,89,149,.07),transparent 70%);
  }
  .card{position:relative;max-width:520px}
  .logo{
    display:inline-flex;align-items:center;gap:9px;font-weight:800;
    font-size:21px;letter-spacing:-.06em;margin-bottom:34px;
  }
  .logo i{
    width:10px;height:10px;border-radius:50%;background:var(--neon);
    box-shadow:0 0 14px var(--neon-glow);
  }
  .code{
    font-size:clamp(74px,17vw,132px);font-weight:800;letter-spacing:-.06em;
    line-height:.9;color:var(--neon-deep);text-shadow:0 0 60px var(--neon-glow);
  }
  h1{font-size:clamp(23px,4vw,31px);font-weight:700;letter-spacing:-.03em;margin:20px 0 12px}
  p{color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:30px}
  .row{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}
  a{
    display:inline-flex;align-items:center;gap:7px;padding:12px 22px;
    border-radius:100px;border:1px solid var(--line);text-decoration:none;
    color:var(--white);font-weight:600;font-size:14.5px;
    transition:border-color .2s,background .2s,transform .2s;
  }
  a:hover{border-color:var(--neon-deep);transform:translateY(-1px)}
  a.primary{background:var(--neon);color:var(--black);border-color:var(--neon)}
  @media (prefers-reduced-motion:reduce){a{transition:none}a:hover{transform:none}}
</style>
</head>
<body>
  <div class="card">
    <span class="logo"><i></i>TyF</span>
    <div class="code">404</div>
    <h1>That page does not exist.</h1>
    <p>The link may be old, or slightly mistyped. Everything lives on one page —
       the buttons below will get you back to it.</p>
    <div class="row">
      <a class="primary" href="/">Back to the site</a>
      <a href="/#demo">Watch the demo</a>
      <a href="/#join">Join the waitlist</a>
    </div>
  </div>
</body>
</html>
